# --- Keeping $hg_bookmark / $hg_status current -------------------------------

[[startup]]
command = ["bin/hgwt", "startup"]
platforms = ["linux", "macos"]

[[startup]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "startup"]
platforms = ["windows"]

[[events]]
on = "workspace.focused"
command = ["bin/hgwt", "refresh", "--event"]
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "refresh", "--event"]
platforms = ["windows"]

[[events]]
on = "workspace.created"
command = ["bin/hgwt", "refresh", "--event"]
platforms = ["linux", "macos"]

[[events]]
on = "workspace.created"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "refresh", "--event"]
platforms = ["windows"]

[[events]]
on = "workspace.closed"
command = ["bin/hgwt", "refresh", "--event"]
platforms = ["linux", "macos"]

[[events]]
on = "workspace.closed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "refresh", "--event"]
platforms = ["windows"]

# agents edit files without running hg; refresh *N when one settles
[[events]]
on = "pane.agent_status_changed"
command = ["bin/hgwt", "refresh", "--event"]
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "refresh", "--event"]
platforms = ["windows"]
