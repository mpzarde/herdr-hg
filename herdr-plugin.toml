id = "mpzarde.hg-worktree"
name = "hg worktrees"
version = "0.7.0"
min_herdr_version = "0.9.0"
description = "Mercurial (hg share) worktree workspaces with git fallthrough, plus hg sidebar status"
platforms = ["linux", "macos", "windows"]

# --- Actions (bind these in config.toml, see README) ------------------------
# Each action opens a popup because creating/opening/removing needs input.

[[actions]]
id = "new"
title = "New worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "new"]
platforms = ["linux", "macos"]

[[actions]]
id = "new-win"
title = "New worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "new"]
platforms = ["windows"]

[[actions]]
id = "open"
title = "Open worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "open"]
platforms = ["linux", "macos"]

[[actions]]
id = "open-win"
title = "Open worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "open"]
platforms = ["windows"]

[[actions]]
id = "remove"
title = "Remove worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "remove"]
platforms = ["linux", "macos"]

[[actions]]
id = "remove-win"
title = "Remove worktree (hg share or git worktree)"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "remove"]
platforms = ["windows"]

[[actions]]
id = "prune"
title = "Clean up hg shares and bookmarks whose work has landed"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "prune"]
platforms = ["linux", "macos"]

[[actions]]
id = "prune-win"
title = "Clean up hg shares and bookmarks whose work has landed"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "prune"]
platforms = ["windows"]

[[actions]]
id = "close-group"
title = "Close hg repo workspace and all its shares"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "close-group"]
platforms = ["linux", "macos"]

[[actions]]
id = "close-group-win"
title = "Close hg repo workspace and all its shares"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "close-group"]
platforms = ["windows"]

[[actions]]
id = "info"
title = "Show hg details (bookmark, parent, remote, unpushed, shares)"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "info"]
platforms = ["linux", "macos"]

[[actions]]
id = "info-win"
title = "Show hg details (bookmark, parent, remote, unpushed, shares)"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "info"]
platforms = ["windows"]

[[actions]]
id = "setup"
title = "Set up hg worktrees (keys, sidebar, hg hooks)"
contexts = ["workspace"]
command = ["bin/hgwt", "action", "setup"]
platforms = ["linux", "macos"]

[[actions]]
id = "setup-win"
title = "Set up hg worktrees (keys, sidebar, hg hooks)"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "action", "setup"]
platforms = ["windows"]

[[actions]]
id = "refresh"
title = "Refresh hg sidebar status"
contexts = ["workspace"]
command = ["bin/hgwt", "refresh"]
platforms = ["linux", "macos"]

[[actions]]
id = "refresh-win"
title = "Refresh hg sidebar status"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/hgwt.ps1", "refresh"]
platforms = ["windows"]

# --- Popups ------------------------------------------------------------------

